# DEMO ONLY: a fake password. Never commit real secrets to Git
# (use Sealed Secrets, SOPS or External Secrets, see 04_Configuration_and_Secrets.md).
# The key name is the Spring property name, so the mounted file
# /etc/secrets/app.db-password becomes the property app.db-password.
apiVersion: v1
kind: Secret
metadata:
  name: greeting-secret
  labels: { app: greeting-api }
type: Opaque
stringData:
  app.db-password: "s3cr3t-demo-only"
