# 2.2 Pod phases: one Pod that exits 0 (Succeeded), one that exits 1 (Failed). restartPolicy Never.
apiVersion: v1
kind: Pod
metadata: { name: job-ok, labels: { demo: phases } }
spec:
  restartPolicy: Never
  containers:
    - name: task
      image: busybox:1.36
      command: ["sh", "-c", "echo working; sleep 5; echo done; exit 0"]
---
apiVersion: v1
kind: Pod
metadata: { name: job-fail, labels: { demo: phases } }
spec:
  restartPolicy: Never
  containers:
    - name: task
      image: busybox:1.36
      command: ["sh", "-c", "echo working; sleep 5; echo 'something broke' >&2; exit 1"]
