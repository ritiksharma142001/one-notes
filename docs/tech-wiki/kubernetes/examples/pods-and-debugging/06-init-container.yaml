# 2.4 Init container: the app waits until a Service called "db" exists in DNS.
apiVersion: v1
kind: Pod
metadata: { name: init-demo }
spec:
  initContainers:
    - name: wait-db
      image: busybox:1.36
      command: ["sh", "-c", "until nslookup db.default.svc.cluster.local; do echo waiting for db; sleep 2; done"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo app started; sleep 600"]
