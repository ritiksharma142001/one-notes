# 9.2 Rollout stuck: a working Deployment, later updated to a bad image tag.
apiVersion: apps/v1
kind: Deployment
metadata: { name: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: shop } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  progressDeadlineSeconds: 60          # report "stuck" after 60 s instead of the default 600 s
  template:
    metadata: { labels: { app: shop } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo shop > /www/index.html && httpd -f -p 8080 -h /www"]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 2
