# 2.3 / 9.2 Probe timing mistake: a slow app (25 s startup) with no startupProbe and an
# aggressive liveness probe -> killed before it can start -> CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata: { name: slow-start-demo }
spec:
  containers:
    - name: app
      image: greeting-api:1.0.0
      imagePullPolicy: IfNotPresent
      env:
        - { name: APP_STARTUP_DELAY_MS, value: "25000" }
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits:   { memory: 512Mi }
      livenessProbe:
        httpGet: { path: /actuator/health/liveness, port: 8080 }
        initialDelaySeconds: 5
        periodSeconds: 3
        failureThreshold: 3
