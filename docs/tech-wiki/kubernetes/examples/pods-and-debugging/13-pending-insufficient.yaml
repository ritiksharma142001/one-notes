# 9.2 Pending: asks for more memory than any node has.
apiVersion: v1
kind: Pod
metadata: { name: too-big }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "600"]
      resources:
        requests: { memory: 10Gi }        # the minikube node has ~2.4 GiB allocatable
