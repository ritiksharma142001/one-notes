# 2.5 The three QoS classes. Check with: kubectl get pod <name> -o jsonpath='{.status.qosClass}'
apiVersion: v1
kind: Pod
metadata: { name: qos-guaranteed }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "600"]
      resources:
        requests: { cpu: 100m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 32Mi }      # requests == limits for cpu AND memory
---
apiVersion: v1
kind: Pod
metadata: { name: qos-burstable }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "600"]
      resources:
        requests: { memory: 32Mi }                 # some requests, not equal to limits
---
apiVersion: v1
kind: Pod
metadata: { name: qos-besteffort }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "600"]                    # no requests or limits at all
