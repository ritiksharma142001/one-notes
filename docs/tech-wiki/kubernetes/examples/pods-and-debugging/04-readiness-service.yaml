# 2.3 Readiness probe failing -> Pod removed from the Service, NOT restarted.
apiVersion: v1
kind: Pod
metadata:
  name: ready-demo
  labels: { app: ready-demo }
spec:
  containers:
    - name: app
      image: greeting-api:1.0.0
      imagePullPolicy: IfNotPresent
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits:   { memory: 512Mi }
      readinessProbe:
        httpGet: { path: /actuator/health/readiness, port: 8080 }
        periodSeconds: 2
        failureThreshold: 1
      livenessProbe:
        httpGet: { path: /actuator/health/liveness, port: 8080 }
        initialDelaySeconds: 30
        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: ready-demo }
spec:
  selector: { app: ready-demo }
  ports: [{ port: 80, targetPort: 8080 }]
