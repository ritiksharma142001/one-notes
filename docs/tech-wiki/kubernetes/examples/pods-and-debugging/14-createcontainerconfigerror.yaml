# 9.2 CreateContainerConfigError: refers to a Secret that does not exist.
apiVersion: v1
kind: Pod
metadata: { name: missing-secret }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "600"]
      env:
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
