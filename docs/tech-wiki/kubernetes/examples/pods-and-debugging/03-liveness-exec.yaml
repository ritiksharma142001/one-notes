# 2.3 Liveness probe failing -> container restarted.
# The app creates /tmp/healthy, then "hangs" (deletes it) after 20 s.
apiVersion: v1
kind: Pod
metadata: { name: liveness-demo }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "touch /tmp/healthy; sleep 20; rm /tmp/healthy; sleep 600"]
      livenessProbe:
        exec: { command: ["cat", "/tmp/healthy"] }
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
