# 9.2 Service with no endpoints: the selector has a typo (app: web vs app: webb).
apiVersion: v1
kind: Pod
metadata:
  name: web2
  labels: { app: web }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo hello > /www/index.html && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata: { name: web-svc }
spec:
  selector: { app: webb }                  # TYPO: matches no Pod
  ports: [{ port: 80, targetPort: 8080 }]
