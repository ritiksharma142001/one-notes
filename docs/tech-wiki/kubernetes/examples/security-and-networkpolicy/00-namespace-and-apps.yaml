# Test bed for 5.4 and 8.2: namespace "shop" with a db, an api and an unrelated "other" Pod.
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: v1
kind: Pod
metadata: { name: db, namespace: shop, labels: { app: db } }
spec:
  containers:
    - name: db                       # stand-in for a database: a tiny web server on port 5432
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo db-ok > /www/index.html && httpd -f -p 5432 -h /www"]
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: shop }
spec:
  selector: { app: db }
  ports: [{ port: 5432 }]
---
apiVersion: v1
kind: Pod
metadata: { name: api, namespace: shop, labels: { app: api } }
spec:
  containers:
    - name: api
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata: { name: other, namespace: shop, labels: { app: other } }
spec:
  containers:
    - name: other
      image: busybox:1.36
      command: ["sleep", "3600"]
